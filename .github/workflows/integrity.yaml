name: 'integrity'

on:
  pull_request:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 'Check for CRLF line endings'
        uses: gi-org-pl/check-crlf-action@464995c09f1659cd4b0f7e2bf7234994f0fd705e # v1.0.2
      - name: 'Check for file permission changes'
        uses: gi-org-pl/check-file-permissions-action@1cec1b07fa817da3da98bd2da20992365d6b4da6 # v1.0.0
      - name: 'Check app version is unique'
        uses: gi-org-pl/check-version-action@c884d1e92d3eef7b26d6277d49f18d0803009d73 # v1.0.0
        with:
          version: "$(jq -r '.version' package.json)"
  code:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Copy environment variables'
        run: 'cp .env.dist .env'
      - name: 'Run docker compose environment'
        id: 'environment'
        timeout-minutes: 3
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: 'Run code formatting check'
        run: docker compose exec app npm run format
      - name: 'Run static code analysis'
        run: docker compose exec app npm run lint
      - name: 'Run functional tests'
        run: docker compose exec app npm run test:functional
  infra:
    if: github.actor != 'dependabot[bot]'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_VAR_migration_ingress_cidr: ${{ vars.MIGRATION_INGRESS_CIDR }}
      TF_VAR_db_password: 'unused-in-plans-0000'
      TF_VAR_jwt_private_key: 'unused-in-plans'
      TF_VAR_jwt_public_key: 'unused-in-plans'
      TF_VAR_adsb_api_token: 'unused-in-plans'
      TF_VAR_skylink_api_token: 'unused-in-plans'
      TF_VAR_discord_webhook_url: 'unused-in-plans'
      TF_VAR_discord_app_token: 'unused-in-plans'
      TF_VAR_discord_client_secret: 'unused-in-plans'
      TF_VAR_mailgun_api_key: 'unused-in-plans'
      TF_VAR_cloudflare_tunnel_token: 'unused-in-plans'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: 'Set up OpenTofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: 'infra/.opentofu-version'
          tofu_wrapper: false
      - name: 'Initialize OpenTofu'
        run: 'tofu -chdir=infra init -input=false'
      - name: 'Plan infrastructure changes'
        run: 'tofu -chdir=infra plan -input=false -lock-timeout=10m -out=tfplan'
      - name: 'Report the plan'
        if: always()
        continue-on-error: true
        uses: gi-org-pl/report-tofu-plan-action@3e9723344bbd1c09659e14bf34be192d8db84213 # v1.0.1
        with:
          working-directory: 'infra'
