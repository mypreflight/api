services:
  app:
    depends_on:
      database:
        condition: service_healthy
    image: ghcr.io/mypreflight/flight-tracker-api
    build:
      context: .
      target: development
    env_file:
      - .env
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
    ports:
      - '80:3000'
    healthcheck:
      test: 'curl --fail http://localhost:3000/api || exit 1'
      interval: 500ms
      retries: 3600
      start_period: 3s
      timeout: 500ms

  database:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'pass'
      POSTGRES_DB: 'app'
    ports:
      - '5432:5432'
    healthcheck:
      test: 'pg_isready -U user -d app'
      interval: 1s
      timeout: 500ms
      retries: 30

  mock:
    image: mockoon/cli:9.10.0@sha256:1d40ef410f57e5698f9c6e42f790648d270a61fdb2b5f9d29f1aac1b3688888f
    command:
      - '--disable-admin-api'
      - '--data'
      - '/data/adsb.json'
      - '/data/skylink.json'
      - '/data/simbrief.json'
      - '/data/weather.json'
      - '/data/google.json'
      - '/data/sayintentions.json'
      - '/data/discord.json'
      - '/data/functions/aerolopa.json'
      - '/data/functions/osm.json'
      - '/data/functions/postcard.json'
      - '/data/functions/oceanic-tracks.json'
      - '/data/faa-datis.json'
      - '/data/atis-guru.json'
      - '/data/vatsim.json'
      - '/data/openai.json'
    volumes:
      - ./docker/mock:/data:ro
    ports:
      - '1080-1094:1080-1094'
    networks:
      default:
        aliases:
          - adsb-mock
          - skylink-mock
          - simbrief-mock
          - weather-mock
          - google-mock
          - sayintentions-mock
          - discord-mock
          - functions-mock
          - faa-datis-mock
          - atis-guru-mock
          - vatsim-mock
          - openai-mock
